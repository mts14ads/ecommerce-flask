{% extends "base.html" %}
{% block title %}Compra{% endblock %}
{% block content %}
<h2>Compra</h2>
<form method="post" class="form">

<label>Quantidade<input type="number" min="1" name="quantidade" required value="{{ registro.quantidade if registro else 1 }}"></label>
<label>Valor unitário<input type="number" step="0.01" min="0" name="valor_unitario" required value="{{ registro.valor_unitario if registro else '' }}"></label>
<label>Comprador<select name="comprador_id" required>{% for u in usuarios %}<option value="{{ u.id }}" {% if registro and registro.comprador_id == u.id %}selected{% endif %}>{{ u.nome }}</option>{% endfor %}</select></label>
<label>Anúncio<select name="anuncio_id" required>{% for a in anuncios %}<option value="{{ a.id }}" {% if registro and registro.anuncio_id == a.id %}selected{% endif %}>{{ a.titulo }}</option>{% endfor %}</select></label>

<button class="button" type="submit">Salvar</button>
<a href="{{ url_for('main.compras') }}">Cancelar</a>
</form>
{% endblock %}
