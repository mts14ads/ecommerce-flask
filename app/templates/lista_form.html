{% extends "base.html" %}
{% block title %}Lista de favoritos{% endblock %}
{% block content %}
<h2>Lista de favoritos</h2>
<form method="post" class="form">

<label>Nome<input name="nome" required value="{{ registro.nome if registro else '' }}"></label>
<label>Usuário<select name="usuario_id" required>{% for u in usuarios %}<option value="{{ u.id }}" {% if registro and registro.usuario_id == u.id %}selected{% endif %}>{{ u.nome }}</option>{% endfor %}</select></label>

<button class="button" type="submit">Salvar</button>
<a href="{{ url_for('main.favoritos') }}">Cancelar</a>
</form>
{% endblock %}
