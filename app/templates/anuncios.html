{% extends "base.html" %}

{% block content %}

<h2>Anúncios</h2>

<p>

<a href="{{ url_for('main.novo_anuncio') }}">
    + Novo anúncio
</a>

</p>

<ul>

{% for anuncio in anuncios %}

<li>

    <strong>
        {{ anuncio.titulo }}
    </strong>

    -

    R$ {{ "%.2f"|format(anuncio.preco) }}

    -

    Categoria:
    {{ anuncio.categoria.nome }}

</li>

{% else %}

<li>
    Nenhum anúncio cadastrado.
</li>

{% endfor %}

</ul>

{% endblock %}
