{% extends "base.html" %}
{% block title %}Categorias{% endblock %}
{% block content %}
<div class="topbar"><h2>Categorias</h2><a class="button" href="{{ url_for('main.categoria_novo') }}">Novo registro</a></div>
<table><thead><tr><th>ID</th><th>Nome</th><th>Descrição</th><th>Ações</th></tr></thead><tbody>{% for r in registros %}<tr><td>{{ r.id }}</td><td>{{ r.nome }}</td><td>{{ r.descricao }}</td><td class="actions"><a href="{{ url_for('main.categoria_editar', id=r.id) }}">Editar</a><form method="post" action="{{ url_for('main.categoria_excluir', id=r.id) }}" onsubmit="return confirmarExclusao()"><button>Excluir</button></form></td></tr>{% else %}<tr><td colspan="4">Nenhum registro.</td></tr>{% endfor %}</tbody></table>
{% endblock %}
