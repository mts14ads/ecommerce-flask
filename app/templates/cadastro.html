```html
{% extends "base.html" %}

{% block content %}

<div class="row justify-content-center">
    <div class="col-md-6 card p-4 shadow-sm">

        <h2>Cadastro</h2>

        <form method="post">

            <input
                class="form-control mb-3"
                name="nome"
                placeholder="Nome"
                required
            >

            <input
                class="form-control mb-3"
                type="email"
                name="email"
                placeholder="E-mail"
                required
            >

            <input
                class="form-control mb-3"
                type="password"
                name="senha"
                placeholder="Senha"
                required
            >

            <button class="btn btn-primary">
                Cadastrar
            </button>

        </form>

    </div>
</div>

{% endblock %}
```
